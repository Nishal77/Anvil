name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # golangci-lint-action@v6 only supports golangci-lint v1.x — pinning
      # to a v2.x version string fails outright ("golangci-lint v2 is not
      # supported by golangci-lint-action v6, you must update to
      # golangci-lint-action v7"). This repo's .golangci.yml is a v2-schema
      # config (version: "2", linters.exclusions.rules), which v1 cannot
      # parse either way — v7 of the action is required, not optional.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -trimpath ./...
