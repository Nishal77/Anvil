version: "2"

linters:
  enable:
    - forbidigo     # bans fmt.Println/Print — log/slog only (CLAUDE.md §5.2)
    - contextcheck   # ctx must be threaded, never context.TODO() in committed code
    - wrapcheck       # errors crossing a package boundary must be wrapped (I-10)
    - depguard        # only cmd/runner and internal/sandbox/runner may touch Docker
    - gocyclo
    - gocognit
    - nestif
    - errcheck
    - unused
    - staticcheck
  settings:
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: "use log/slog, not fmt.Print* — CLAUDE.md §5.2"
        - pattern: ^os\.Getenv$
          msg: "env vars are read in internal/config only — add a field to config.Config instead"
    depguard:
      rules:
        # The control plane should never touch Docker directly. Only
        # internal/sandbox/runner and its one caller, cmd/runner, are
        # allowed to import a Docker client — anywhere else, this fails
        # the build instead of relying on someone catching it in review.
        all:
          files:
            - "!**/internal/sandbox/runner/**"
            - "!**/cmd/runner/**"
          deny:
            - pkg: github.com/moby/moby/client
              desc: "Docker client access is confined to internal/sandbox/runner and cmd/runner"
            - pkg: github.com/docker/docker/client
              desc: "Docker client access is confined to internal/sandbox/runner and cmd/runner"
    gocyclo:
      min-complexity: 10
    gocognit:
      min-complexity: 15
    nestif:
      min-complexity: 3
  exclusions:
    rules:
      # contextcheck cannot follow context flow through a three-level
      # closure (middleware factory -> handler -> deferred recover func),
      # and flags every ctx-using call inside a `defer func() { recover()
      # ... }()` as "should pass the context parameter" even when it
      # already does (r.Context() is passed explicitly). This is the
      # standard Go panic-recovery idiom, not a place ctx is actually
      # dropped — verified by reading internal/api/middleware.go's
      # recoverPanic by hand.
      - path: internal/api/middleware\.go
        linters:
          - contextcheck
      # os.Getenv is the one thing internal/config exists to wrap — see
      # the forbidigo rule above.
      - path: internal/config/config\.go
        linters:
          - forbidigo
      # The os.Getenv ban is a production-code rule (env vars flow through
      # config.Config, not scattered os.Getenv calls). It was never meant
      # to reach test files, which legitimately use env vars to control a
      # re-exec'd subprocess — the standard Go os/exec "TestHelperProcess"
      # pattern (see internal/queue/crash_recovery_test.go). fmt.Print* is
      # still banned in tests; only this one rule is test-exempt.
      - path: _test\.go
        linters:
          - forbidigo
        text: "os\\.Getenv"
      # Every cmd/*/main.go's job is just flag/env parsing and wiring up
      # its dependencies, nothing else. cmd/anvil happens to use
      # internal/config to centralize its env reads, but cmd/runner is a
      # separately deployed binary with its own, unrelated settings
      # (ANVIL_RUNNER_ADDR, ANVIL_SANDBOX_IMAGE) — sharing one Config
      # struct across two independently deployed processes would tie
      # their settings together for no real benefit.
      - path: cmd/runner/main\.go
        linters:
          - forbidigo
        text: "os\\.Getenv"
      # cmd/anvilctl is a CLI, not a server: printing to stdout IS its
      # product (job status, the artifact download hint), not a logging
      # concern log/slog exists to replace. Its --email/--password flags
      # fall back to ANVIL_EMAIL/ANVIL_PASSWORD for convenience — the
      # same "own, unrelated settings" reasoning as cmd/runner/main.go
      # above, not a config.Config field for a value nothing else reads.
      - path: cmd/anvilctl/(run|cancel|client)\.go
        linters:
          - forbidigo

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

# Import-graph boundary enforcement (CLAUDE.md PK5) is not expressible as a
# golangci-lint rule and is checked instead by scripts/check-invariants.sh,
# run via `make check-invariants`.
